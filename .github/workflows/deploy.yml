name: Build and Deploy Robot Shop

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1:Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3
      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      # Step 3: Log in to Docker Hub 
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Step 4: Build and push images
      - name: Build and push Robot Shop images
        run: |
          docker build -f dispatch/Dockerfile -t {{ secrets.DOCKER_USERNAME }}/dispatch:latest dispatch/
          docker push ${{ secrets.DOCKER_USERNAME }}/dispatch:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3
      # Step 2: Set up Kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      # Step 3: Deploy to kubernetes (AKS)
      - name: Apply kubernetes manifests
        run: |
          kubectl apply -f k8s/
